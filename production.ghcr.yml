volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_django_media: {}

services:
  django: &django
    restart: unless-stopped
    mem_limit: 1g
    image: ghcr.io/animemoeus/mono-backend/django:latest
    volumes:
      - production_django_media:/app/backend/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    restart: unless-stopped
    image: ghcr.io/animemoeus/mono-backend/postgres:latest
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres
    ports:
      - "100.73.60.108:63001:5432"

  redis:
    restart: unless-stopped
    image: redis:6

  celeryworker:
    restart: unless-stopped
    <<: *django
    image: ghcr.io/animemoeus/mono-backend/django:latest
    command: /start-celeryworker
    mem_limit: 500m
    #deploy:
    #replicas: 2

  celerybeat:
    restart: unless-stopped
    <<: *django
    image: ghcr.io/animemoeus/mono-backend/django:latest
    command: /start-celerybeat

  flower:
    restart: unless-stopped
    <<: *django
    image: ghcr.io/animemoeus/mono-backend/django:latest
    command: /start-flower

  awscli:
    image: ghcr.io/animemoeus/mono-backend/awscli:latest
    env_file:
      - ./.envs/.production/.django
    volumes:
      - production_postgres_data_backups:/backups:z

  nginx:
    restart: unless-stopped
    image: ghcr.io/animemoeus/mono-backend/nginx:latest
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
    ports:
      - 100.73.60.108:63000:80
