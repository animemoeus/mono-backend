[project]
name = "mono-backend"
version = "0.1.0"
requires-python = "==3.11.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "argon2-cffi==23.1.0",          # https://github.com/hynek/argon2_cffi
  "boto3==1.37.19",               # https://github.com/boto/boto3
  "celery==5.4.0",                # pyup: < 6.0  # https://github.com/celery/celery
  "crispy-bootstrap5==2025.4",    # https://github.com/django-crispy-forms/crispy-bootstrap5

  # Django
  # ------------------------------------------------------------------------------
  "django==4.2.21",               # pyup: < 5.0  # https://www.djangoproject.com/
  "django-allauth==65.5.0",       # https://github.com/pennersr/django-allauth
  "django-anymail==12.0",         # https://github.com/anymail/django-anymail
  "django-celery-beat==2.8.1",    # https://github.com/celery/django-celery-beat
  "django-cors-headers==4.7.0",   # https://github.com/adamchainz/django-cors-headers
  "django-crispy-forms==2.3",     # https://github.com/django-crispy-forms/django-crispy-forms
  "django-environ==0.12.0",       # https://github.com/joke2k/django-environ

  # Django Extensions (needed for runscript command)
  "django-extensions==3.2.3",     # https://github.com/django-extensions/django-extensions
  "django-filter==25.1",          # https://github.com/carltongibson/django-filter
  "django-health-check==3.18.3",  # https://github.com/revsys/django-health-check
  "django-hosts==6.0",            # https://github.com/jazzband/django-hosts
  "django-import-export==4.3.7",  # https://github.com/django-import-export/django-import-export
  "django-model-utils==5.0.0",    # https://github.com/jazzband/django-model-utils

  # discord
  "django-ninja==1.3.0",          # https://github.com/vitalik/django-ninja

  # Monitoring
  "django-prometheus==2.3.1",     # https://pypi.org/project/django-prometheus/
  "django-redis==6.0.0",          # https://github.com/jazzband/django-redis
  "django-simple-history==3.8.0", # https://github.com/jazzband/django-simple-history
  "django-solo==2.4.0",           # https://github.com/lazybird/django-solo

  # Storage
  "django-storages==1.14.6",      # https://github.com/jschneier/django-storages/

  "django-unfold==0.74.1",        # https://pypi.org/project/django-unfold/

  # Django REST Framework
  "djangorestframework==3.16.1",  # https://github.com/encode/django-rest-framework

  # DRF-spectacular for api documentation
  "drf-spectacular==0.28.0",      # https://github.com/tfranzel/drf-spectacular
  "flower==2.0.1",                # https://github.com/mher/flower

  # Production runtime (gunicorn/uvicorn ASGI stack, error tracking, transactional email, Postgres driver)
  # ------------------------------------------------------------------------------
  "gunicorn==23.0.0",             # https://github.com/benoitc/gunicorn
  "hiredis==3.1.0",               # https://github.com/redis/hiredis-py
  "openai==1.68.2",               # https://pypi.org/project/openai/

  # PostgreSQL Vector Extension
  "pgvector==0.4.1",              # https://pypi.org/project/pgvector/
  "pillow==11.2.1",               # https://github.com/python-pillow/Pillow

  # arter tendean
  "pixivpy3==3.7.5",              # https://github.com/upbit/pixivpy
  "psycopg[c]==3.3.4",            # https://github.com/psycopg/psycopg
  "pyscord-storage==2.0.3",       # https://github.com/animemoeus/pyscord-storage
  "pytest-cov==6.0.0",            # https://pypi.org/project/pytest-cov/
  "python-slugify==8.0.4",        # https://github.com/un33k/python-slugify
  "redis==6.2.0",                 # https://github.com/redis/redis-py
  "saiyaku==2023.12.11",          # https://github.com/animemoeus/saiyaku
  "sentry-sdk==2.24.1",           # https://github.com/getsentry/sentry-python
  "tenacity==9.0.0",              # https://pypi.org/project/tenacity/
  "uvicorn[standard]==0.34.0",    # https://github.com/encode/uvicorn
  "uvicorn-worker==0.3.0",        # https://github.com/Kludex/uvicorn-worker
  "whitenoise==6.11.0",           # https://github.com/evansd/whitenoise
]

[dependency-groups]
dev = [
  "coverage==7.15.2",                                    # https://github.com/nedbat/coveragepy
  "django-coverage-plugin==3.2.0",                      # https://github.com/nedbat/django_coverage_plugin
  "django-debug-toolbar==6.1.0",                        # https://github.com/jazzband/django-debug-toolbar
  "django-stubs[compatible-mypy]==4.2.6",               # https://github.com/typeddjango/django-stubs
  "djangorestframework-stubs[compatible-mypy]==3.14.4", # https://github.com/typeddjango/djangorestframework-stubs
  "djlint==1.36.4",                                     # https://github.com/Riverside-Healthcare/djLint

  # Django
  # ------------------------------------------------------------------------------
  "factory-boy==3.3.3",                                 # https://github.com/FactoryBoy/factory_boy
  "ipdb==0.13.13",                                      # https://github.com/gotcha/ipdb

  # Testing
  # ------------------------------------------------------------------------------
  "mypy==1.6.1",                                        # https://github.com/python/mypy
  "pre-commit==4.2.0",                                  # https://github.com/pre-commit/pre-commit
  "pytest==8.3.5",                                      # https://github.com/pytest-dev/pytest
  "pytest-django==4.10.0",                              # https://github.com/pytest-dev/pytest-django
  "pytest-sugar==1.0.0",                                # https://github.com/Frozenball/pytest-sugar

  # Code quality
  # ------------------------------------------------------------------------------
  "ruff==0.16.0",                                       # https://github.com/astral-sh/ruff

  # Documentation
  # ------------------------------------------------------------------------------
  "sphinx==8.2.3",                                      # https://github.com/sphinx-doc/sphinx
  "sphinx-autobuild==2024.10.3",                        # https://github.com/GaretJax/sphinx-autobuild
  "watchfiles==1.0.4",                                  # https://github.com/samuelcolvin/watchfiles
  "werkzeug[watchdog]==3.1.3",                          # https://github.com/pallets/werkzeug
]

[tool.uv]
package = false

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/Riverside-Healthcare/djLint/issues/687
ignore = "H006,H030,H031,T002"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812", # Conflicts with the ruff formatter, see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.python_files = [
  "test_*.py",
  "tests.py",
]
ini_options.addopts = "--ds=config.settings.test --reuse-db"

[tool.coverage]
# ==== Coverage ====
run.include = [ "*/tests.py", "*/tests/*", "core/**" ]
run.omit = [ "*/migrations/*" ]
run.plugins = [ "django_coverage_plugin" ]
